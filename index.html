<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan ZAYN</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Anton&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:'Poppins',sans-serif;background:#0a0a14;color:white}.anton{font-family:'Anton',sans-serif}.card{background:rgba(18,10,42,0.9);border:1.5px solid #7c3aed;border-radius:16px}.progress{height:10px;background:#1a1a2e;border-radius:10px;overflow:hidden}.progress-bar{height:100%;transition:width.5s}</style>
</head>
<body class="min-h-screen p-4 pb-20">
<div class="max-w-[420px] mx-auto">
<div class="text-center py-4"><div class="inline-block bg-[#1a1a2e] border border-purple-600 px-4 py-1 rounded-full text-[10px]">💰 KEUANGAN ZAYN</div><h1 class="anton text-[36px] leading-[0.9] mt-3">DOMPET<br><span class="text-purple-400">ZAYN!</span></h1><p class="text-[11px] opacity-60 mt-1">Semangat Nabung nya</p></div>
<div class="card p-4"><div class="flex justify-between"><div><p class="text-[11px] opacity-60">SISA MINGGU INI</p><h2 id="sisa" class="text-2xl font-bold">Rp 200.000</h2><p id="terpakai" class="text-[10px] opacity-60">Terpakai Rp 0</p></div><div class="text-right"><button onclick="resetMinggu()" class="text-[9px] bg-purple-600 px-2 py-1 rounded-full">RESET</button></div></div><div class="progress mt-3"><div id="bar" class="progress-bar bg-purple-500" style="width:0%"></div></div><p id="warning" class="text-[10px] mt-2 hidden"></p></div>
<div class="grid grid-cols-2 gap-3 mt-4"><button onclick="openModal('masuk')" class="bg-green-600 rounded-xl py-3 font-bold text-sm">+ MASUK</button><button onclick="openModal('keluar')" class="bg-red-600 rounded-xl py-3 font-bold text-sm">- KELUAR</button></div>
<div class="card p-4 mt-4"><h3 class="font-bold text-[12px] mb-2">PENGELUARAN 7 HARI</h3><canvas id="chartHari" height="140"></canvas></div>
<div class="card p-4 mt-4"><div class="flex justify-between mb-2"><h3 class="font-bold text-[12px]">RIWAYAT</h3><div class="flex gap-1"><button onclick="filterData('semua')" class="fbtn text-[9px] bg-purple-600 px-2 py-1 rounded">SEMUA</button><button onclick="filterData('hari')" class="fbtn text-[9px] bg-[#1a1a2e] px-2 py-1 rounded">HARI INI</button><button onclick="exportCSV()" class="text-[9px] bg-[#1a1a2e] px-2 py-1 rounded">EXPORT</button></div></div><div id="list" class="space-y-2"></div></div>
<div class="card p-3 mt-4 text-center"><p class="text-[10px] opacity-60">TARGET NABUNG 600K</p><div class="flex justify-between text-[11px] mt-1"><span id="tabung">Rp 0 / Rp 600.000</span><span id="persen">0%</span></div><div class="progress mt-2"><div id="barTabung" class="progress-bar bg-green-500" style="width:0%"></div></div></div>
<p class="text-center text-[9px] opacity-40 mt-6">© 2026 Dompet ZAYN</p>
</div>
<div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50"><div class="card p-5 w-full max-w-[360px]"><h3 id="mTitle" class="font-bold mb-3">Tambah</h3><input id="jumlah" type="number" placeholder="Nominal Rp (ex: 50000)" class="w-full bg-[#0a0a14] border border-purple-600 rounded-lg p-3 text-sm mb-2"><div id="catWrap"><select id="kategori" class="w-full bg-[#0a0a14] border border-purple-600 rounded-lg p-3 text-sm mb-2"><option value="jajan">🍜 Jajan</option><option value="kuota">📶 Kuota</option><option value="bensin">⛽ Bensin</option><option value="topup">💳 Top Up</option><option value="nabung">💰 Nabung</option><option value="lain">📦 Lain-lain</option></select></div><input id="catatan" type="text" placeholder="Catatan" class="w-full bg-[#0a0a14] border border-purple-600 rounded-lg p-3 text-sm mb-3"><div class="grid grid-cols-2 gap-2"><button onclick="closeModal()" class="bg-[#1a1a2e] rounded-lg py-2 text-sm">Batal</button><button onclick="save()" class="bg-purple-600 rounded-lg py-2 text-sm font-bold">SIMPAN</button></div></div></div>
<script>
let data=JSON.parse(localStorage.getItem('zayn_keuangan')||'[]');let filter='semua';let tipe='keluar';let BUDGET=200000;let TARGET=600000;
function openModal(t){tipe=t;document.getElementById('mTitle').innerText=t=='masuk'?'+ Pemasukan':'- Pengeluaran';document.getElementById('catWrap').style.display=t=='masuk'?'none':'block';document.getElementById('catatan').placeholder=t=='masuk'?'Catatan: dari ortu, jualan':'Catatan: seblak, bensin';let m=document.getElementById('modal');m.classList.remove('hidden');m.classList.add('flex')}
function closeModal(){let m=document.getElementById('modal');m.classList.add('hidden');m.classList.remove('flex')}
function save(){let j=parseInt(document.getElementById('jumlah').value);let k=document.getElementById('kategori').value;let c=document.getElementById('catatan').value||(tipe=='masuk'?'pemasukan':k);if(!j)return alert('Isi nominal');if(tipe=='masuk')k='masuk';data.unshift({id:Date.now(),type:tipe,jumlah:j,kategori:k,catatan:c,tanggal:new Date().toISOString().slice(0,10)});localStorage.setItem('zayn_keuangan',JSON.stringify(data));document.getElementById('jumlah').value='';document.getElementById('catatan').value='';closeModal();render();}
function render(){let now=new Date();let start=new Date(now);start.setDate(now.getDate()-now.getDay());let keluarMinggu=data.filter(d=>new Date(d.tanggal)>=start && d.type=='keluar').reduce((a,b)=>a+b.jumlah,0);let masukMinggu=data.filter(d=>new Date(d.tanggal)>=start && d.type=='masuk').reduce((a,b)=>a+b.jumlah,0);let sisa=BUDGET-keluarMinggu+masukMinggu;let persen=Math.min(100,(keluarMinggu/BUDGET)*100);document.getElementById('sisa').innerText='Rp '+sisa.toLocaleString('id-ID');document.getElementById('terpakai').innerText='Terpakai Rp '+keluarMinggu.toLocaleString('id-ID');document.getElementById('bar').style.width=persen+'%';document.getElementById('bar').className='progress-bar '+(persen>80?'bg-red-500':persen>60?'bg-yellow-500':'bg-purple-500');let w=document.getElementById('warning');if(persen>80){w.classList.remove('hidden');w.innerText='⚠️ '+Math.round(persen)+'% kepake, rem!'}else if(persen>60){w.classList.remove('hidden');w.innerText='💡 '+Math.round(persen)+'%, hati-hati'}else w.classList.add('hidden');let tabung=data.filter(d=>d.kategori=='nabung').reduce((a,b)=>a+b.jumlah,0);document.getElementById('tabung').innerText='Rp '+tabung.toLocaleString('id-ID')+' / Rp '+TARGET.toLocaleString('id-ID');document.getElementById('persen').innerText=Math.round(tabung/TARGET*100)+'%';document.getElementById('barTabung').style.width=Math.min(100,tabung/TARGET*100)+'%';let filtered=data;if(filter=='hari'){let today=new Date().toISOString().slice(0,10);filtered=data.filter(d=>d.tanggal==today)}let html='';if(filtered.length==0)html='<p class="text-[11px] opacity-40 text-center py-4">Belum ada transaksi</p>';else filtered.slice(0,50).forEach(d=>{let catLabel=d.type=='masuk'? d.catatan : d.kategori+' - '+d.catatan;html+=`<div class="flex justify-between items-center bg-[#0a0a14] p-2 rounded-lg border border-[#2a2a4a]"><div><p class="text-[12px] font-semibold ${d.type=='keluar'?'text-red-400':'text-green-400'}">${d.type=='keluar'?'-':'+'} Rp ${d.jumlah.toLocaleString('id-ID')}</p><p class="text-[10px] opacity-60">${catLabel} • ${d.tanggal}</p></div><button onclick="hapus(${d.id})" class="text-[10px] opacity-40">✕</button></div>`});document.getElementById('list').innerHTML=html;let labels=[];let vals=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().slice(0,10);labels.push(ds.slice(5));let tot=data.filter(x=>x.tanggal==ds && x.type=='keluar').reduce((a,b)=>a+b.jumlah,0);vals.push(tot);}if(window.myChart)window.myChart.destroy();window.myChart=new Chart(document.getElementById('chartHari'),{type:'bar',data:{labels:labels,datasets:[{data:vals,backgroundColor:'#7c3aed'}]},options:{plugins:{legend:{display:false}},scales:{y:{display:false},x:{ticks:{color:'#666',font:{size:9}}}}}});}
function hapus(id){if(confirm('Hapus?')){data=data.filter(d=>d.id!=id);localStorage.setItem('zayn_keuangan',JSON.stringify(data));render()}}
function filterData(f){filter=f;document.querySelectorAll('.fbtn').forEach(b=>b.className='fbtn text-[9px] bg-[#1a1a2e] px-2 py-1 rounded');event.target.className='fbtn text-[9px] bg-purple-600 px-2 py-1 rounded';render()}
function resetMinggu(){if(confirm('Reset minggu ini?')){let now=new Date();let start=new Date(now);start.setDate(now.getDate()-now.getDay());data=data.filter(d=>new Date(d.tanggal)<start);localStorage.setItem('zayn_keuangan',JSON.stringify(data));render()}}
function exportCSV(){let csv='tanggal,tipe,jumlah,kategori,catatan\n'+data.map(d=>`${d.tanggal},${d.type},${d.jumlah},${d.kategori},${d.catatan}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='keuangan-zayn.csv';a.click()}
render();
</script>
</body>
</html>
